name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p site/demo site/examples
          cp index.html site/index.html
          cp site.css site/site.css
          cp site.js site/site.js
          cp README.md site/README.md
          cp CHANGELOG.md site/CHANGELOG.md
          cp -r demo/* site/demo/
          cp -r examples/* site/examples/
          cp feathertext.css site/feathertext.css
          cp feathertext.js site/feathertext.js
          cp feathertext.min.js site/feathertext.min.js
          cp -r dist site/dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
