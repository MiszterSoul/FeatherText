name: Security release maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-release-maintenance.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  security-events: read

concurrency:
  group: security-release-maintenance
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@misztersoul/feathertext'
  RELEASE_TAG: v0.4.0
  RELEASE_VERSION: 0.4.0

jobs:
  maintain:
    name: Fix, verify, release, and publish
    if: github.repository == 'MiszterSoul/FeatherText' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply security and release changes
        env:
          MAINTENANCE_SCRIPT_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          payload = base64.b64decode(os.environ["MAINTENANCE_SCRIPT_GZIP_BASE64"])
          path = Path(os.environ["RUNNER_TEMP"]) / "security-release-maintenance.py"
          path.write_bytes(gzip.decompress(payload))
          PY
          python "$RUNNER_TEMP/security-release-maintenance.py"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify core project and package
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm run test
          npm run build
          npm run size
          npm run package:check

      - name: Commit verified changes to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare @misztersoul/feathertext 0.4.0"
          git push origin HEAD:main
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove every branch except main
        env:
          MAIN_BRANCH: main
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort -u
          )
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "$MAIN_BRANCH" ]]; then
              continue
            fi
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort -u)"
          if [[ "$remaining" != "$MAIN_BRANCH" ]]; then
            echo "Unexpected remaining branches:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

      - name: Dispatch and verify CI and CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main

          wait_for_workflow() {
            local workflow="$1"
            local run_id=""
            for _ in {1..30}; do
              run_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --created ">=$before" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            if [[ -z "$run_id" ]]; then
              echo "Unable to locate dispatched workflow: $workflow" >&2
              exit 1
            fi
            gh run watch "$run_id" --exit-status
          }

          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml

          for _ in {1..12}; do
            high_count="$(gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" --jq '[.[] | select((.rule.security_severity_level // .rule.severity // "") == "high" or (.rule.security_severity_level // "") == "critical")] | length')"
            if [[ "$high_count" == "0" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$high_count" != "0" ]]; then
            echo "CodeQL still reports $high_count open high/critical alerts on main." >&2
            gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" --jq '.[] | select((.rule.security_severity_level // .rule.severity // "") == "high" or (.rule.security_severity_level // "") == "critical") | [.number, .rule.id, .most_recent_instance.location.path, .most_recent_instance.location.start_line] | @tsv' >&2
            exit 1
          fi

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 || gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to overwrite a release." >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "FeatherText $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes

      - name: Dispatch and verify npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field "tag=$RELEASE_TAG"

          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list --workflow publish.yml --branch "$RELEASE_TAG" --event workflow_dispatch --created ">=$before" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Unable to locate the publish workflow run." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

          for _ in {1..24}; do
            published="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version 2>/dev/null || true)"
            if [[ "$published" == "$RELEASE_VERSION" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "npm did not return $PACKAGE_NAME@$RELEASE_VERSION after publication." >&2
          exit 1

  report-failure:
    name: Report maintenance failure
    needs: maintain
    if: ${{ always() && needs.maintain.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create diagnostic issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.maintain.result }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/failed.log"
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$log_file" 2>&1 || true
          {
            printf 'The one-shot security release maintenance run finished with `%s`.\n\n' "$RESULT"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '```text\n'
            tail -c 50000 "$log_file"
            printf '\n```\n'
          } > "$RUNNER_TEMP/body.md"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Security release maintenance failed" \
            --body-file "$RUNNER_TEMP/body.md"
