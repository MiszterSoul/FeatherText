name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: '@misztersoul/feathertext'
  EXPECTED_REPOSITORY: MiszterSoul/FeatherText
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    name: Verify and publish public package
    if: github.repository == 'MiszterSoul/FeatherText' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate exact release tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable SemVer: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Run this workflow from the exact tag ref $RELEASE_TAG, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_TAG.slice(1);
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          if (pkg.name !== process.env.EXPECTED_PACKAGE) fail(`Unexpected package name: ${pkg.name}`);
          if (pkg.version !== expectedVersion) fail(`Unexpected package version: ${pkg.version}`);
          if (lock.name !== pkg.name || lock.version !== pkg.version) fail('Lockfile root metadata does not match package.json.');
          if (lock.packages?.['']?.name !== pkg.name || lock.packages?.['']?.version !== pkg.version) {
            fail('Lockfile package metadata does not match package.json.');
          }
          if (pkg.private === true) fail('Package is private.');
          if (pkg.publishConfig?.access !== 'public') fail('publishConfig.access must be public.');
          if (pkg.publishConfig?.registry && pkg.publishConfig.registry !== 'https://registry.npmjs.org/') {
            fail('publishConfig.registry must be the public npm registry.');
          }
          NODE

      - name: Refuse an existing version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$(npm view "$EXPECTED_PACKAGE@$version" version 2>/dev/null || true)" == "$version" ]]; then
            echo "$EXPECTED_PACKAGE@$version already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Size limits
        run: npm run size

      - name: Package checks
        run: npm run package:check

      - name: Publish public package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Verify npm publication
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for _ in {1..30}; do
            published="$(npm view "$EXPECTED_PACKAGE@$version" version 2>/dev/null || true)"
            if [[ "$published" == "$version" ]]; then
              echo "Published $EXPECTED_PACKAGE@$version"
              exit 0
            fi
            sleep 5
          done
          echo "npm did not return $EXPECTED_PACKAGE@$version after publication." >&2
          exit 1
