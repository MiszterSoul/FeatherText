name: Synchronize 0.3.2 documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-release-docs.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize documentation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]}")
              file.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "docs/api.md",
              "Status: current repository source and `index.d.ts`, package metadata `0.3.1`, reconciled 2026-07-28. No GitHub tags or releases exist yet, and the public npm registry returned `404 Not Found` for `feathertext` on 2026-07-28. FeatherText is pre-1.0; pin an exact commit/build and retest before production adoption.",
              "Status: current repository source and `index.d.ts`, package metadata `0.3.2`, reconciled 2026-07-28. The source is configured for the public package `@misztersoul/feathertext`; registry publication is a separate release operation and is not asserted by this reference. FeatherText is pre-1.0; pin an exact version and retest before production adoption.",
          )
          replace_once(
              "docs/api.md",
              "| `feathertext/browser` / browser metadata | `dist/feathertext.min.js`  |",
              "| `@misztersoul/feathertext/browser`       | `dist/feathertext.min.js`  |",
          )
          replace_once(
              "docs/api.md",
              "| `feathertext/feathertext.css`            | `dist/feathertext.css`     |",
              "| `@misztersoul/feathertext/css`           | `dist/feathertext.css`     |",
          )
          replace_once(
              "docs/api.md",
              "| `feathertext/feathertext.min.css`        | `dist/feathertext.min.css` |",
              "| `@misztersoul/feathertext/feathertext.min.css` | `dist/feathertext.min.css` |",
          )
          replace_once(
              "docs/api.md",
              "The browser bundle exposes `globalThis.FeatherText`. Because the public npm registry returned `404 Not Found` for `feathertext` on 2026-07-28, build locally until an exact registry release and its provenance are verified.",
              "The browser bundle exposes `globalThis.FeatherText`. Package metadata is configured for public scoped publication, but consumers must verify that the exact requested version exists in the npm registry before installation or CDN use.",
          )
          replace_once(
              "docs/api.md",
              "- The project is pre-1.0 and package publication is not yet verified.",
              "- The project is pre-1.0; verify the exact npm version and release provenance separately from this source documentation.",
          )

          replace_once(
              "docs/migration-0.3.md",
              "This guide describes the current `0.3` repository implementation. `package.json`, the root package metadata in `package-lock.json`, and `.release-please-manifest.json` declare `0.3.1`; the open bot-created Release Please PR #6 proposes `0.3.2`.",
              "This guide describes the current `0.3` repository implementation. `package.json`, the root package metadata in `package-lock.json`, and `.release-please-manifest.json` declare `0.3.2`.",
          )
          replace_once(
              "docs/migration-0.3.md",
              "Repository metadata and a release PR are not publication evidence. No GitHub tags or releases exist yet, and the public npm registry returned `404 Not Found` for `feathertext` on 2026-07-28. The source and tests contain behavior that older documentation described as future work; this guide records those implementation differences while an eventual tagged release and its release notes remain authoritative for consumers.",
              "Repository metadata is not publication evidence. The source is configured for `@misztersoul/feathertext`; verify an exact registry version and its release notes before consumer migration. This guide records implementation differences within the current 0.3 line.",
          )
          replace_once(
              "docs/migration-0.3.md",
              "| Attribution          | Not configurable                                           | `attribution`, `supportLink`, `projectUrl`, and `supportUrl` are typed/defaulted                                       | Decide policy explicitly; update CSP/new-window expectations                 |",
              "| Footer identity      | Attribution could be hidden or redirected                  | Counters and canonical GitHub/Buy Me a Coffee icon links are permanent; labels appear through accessibility text and hover tooltips | Remove hide/redirect assumptions and preserve the canonical footer           |",
          )
          replace_once(
              "docs/migration-0.3.md",
              "| Types                | Incomplete/absent                                          | `index.d.ts` declares configuration, APIs, plugins, autosave, find, security, and exports                              | Remove local ambient shims and compile against package types                 |",
              "| Localization         | English-only built-in UI                                   | `language: \"en\" | \"hu\"` and `setLanguage()` localize built-in controls, dialogs, counters, and status text           | Select a language in configuration and preserve application-provided strings |\n| Types                | Incomplete/absent                                          | `index.d.ts` declares configuration, localization, APIs, plugins, autosave, find, security, and exports                | Remove local ambient shims and compile against package types                 |",
          )
          replace_once(
              "docs/migration-0.3.md",
              "| Browser/a11y harness | Absent                                                     | 70 Node/JSDOM tests, 85 Playwright E2E executions, and 12 axe checks                                                   | Cite exact evidence only; do not claim latest-two/manual AT/Lighthouse       |",
              "| Browser/a11y harness | Absent                                                     | 74 Node/JSDOM tests, 90 Playwright E2E executions, and 12 axe checks                                                   | Cite exact evidence only; do not claim latest-two/manual AT/Lighthouse       |",
          )

          replace_once(
              "docs/comparison.md",
              "| FeatherText (`0.3.1` repository metadata) |",
              "| FeatherText (`0.3.2` repository metadata) |",
          )
          replace_once(
              "docs/comparison.md",
              "- 71 Node/JSDOM unit/regression tests;",
              "- 74 Node/JSDOM unit/regression tests;",
          )

          replace_once(
              "docs/launch-kit.md",
              "| License/status                     | MIT; pre-1.0; package metadata version `0.3.1`.                                                                                                                                                                                             |",
              "| License/status                     | MIT; pre-1.0; package metadata version `0.3.2`.                                                                                                                                                                                             |",
          )
          replace_once(
              "docs/launch-kit.md",
              "| Release/registry status            | No GitHub tags or releases exist yet; the public npm registry returned `404 Not Found` for `feathertext` on 2026-07-28. Do not claim publication.                                                                                           |",
              "| Release/registry status            | Source is configured for public `@misztersoul/feathertext` publication. Do not claim an npm version is available until the exact registry result is verified.                                                                               |",
          )
          replace_once(
              "docs/launch-kit.md",
              "- [ ] Make no npm availability or publication claim; the latest recorded check returned `404 Not Found` for `feathertext` on 2026-07-28.",
              "- [ ] Verify the exact `@misztersoul/feathertext` registry version immediately before making an npm availability claim.",
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify documentation changes
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm test

      - name: Commit synchronized documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api.md docs/migration-0.3.md docs/comparison.md docs/launch-kit.md
          git commit -m "docs: synchronize the 0.3.2 release line"
          git push origin HEAD:main

  report-failure:
    needs: sync
    if: ${{ always() && needs.sync.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create diagnostic issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt" 2>&1 || true
          {
            echo "Documentation synchronization failed."
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/log.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Documentation synchronization failed" --body-file "$RUNNER_TEMP/body.md"
