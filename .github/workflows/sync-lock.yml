name: sync-lock
on:
  push:
    branches: [agent/standardize-pages-v0.2.0]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/standardize-pages-v0.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore: sync package lock version"
          git push origin HEAD:agent/standardize-pages-v0.2.0
