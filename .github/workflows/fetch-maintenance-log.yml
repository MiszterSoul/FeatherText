name: Fetch maintenance log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-maintenance-log.yml
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create concise failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: '30343484676'
        run: |
          set -euo pipefail
          sleep 5
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt"
          {
            printf 'Failure tail:\n\n```text\n'
            tail -n 80 "$RUNNER_TEMP/log.txt"
            printf '\n```\n'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Security maintenance v2 concise failure" --body-file "$RUNNER_TEMP/body.md"
