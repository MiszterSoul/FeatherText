name: Fetch maintenance log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-maintenance-log.yml
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create filtered failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: '30344310177'
        run: |
          set -euo pipefail
          sleep 5
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt"
          {
            printf 'Filtered failure tail:\n\n```text\n'
            tail -n 140 "$RUNNER_TEMP/log.txt"
            printf '\n```
'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Security maintenance v3 traceback" --body-file "$RUNNER_TEMP/body.md"
