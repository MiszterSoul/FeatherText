name: Fetch maintenance log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-maintenance-log.yml
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create filtered failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: '30345357839'
        run: |
          set -euo pipefail
          sleep 5
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt"
          {
            echo "Filtered failure tail:"
            echo
            tail -n 100 "$RUNNER_TEMP/log.txt"
          } > "$RUNNER_TEMP/body.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Security maintenance v6 traceback" --body-file "$RUNNER_TEMP/body.txt"
