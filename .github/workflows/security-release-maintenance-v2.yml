name: Security release maintenance v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-release-maintenance-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  security-events: read

concurrency:
  group: security-release-maintenance-v2
  cancel-in-progress: false

jobs:
  maintain:
    name: Apply, test, and verify security release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and apply release changes
        run: |
          set -euo pipefail
          cat .github/scripts/security-release-maintenance.py.part* > "$RUNNER_TEMP/maintenance.py"
          echo "858ab3c7fc9c73e7857f61b13603ee362333df87468ac5cb3c38c0a1f3c3aa97  $RUNNER_TEMP/maintenance.py" | sha256sum --check
          python "$RUNNER_TEMP/maintenance.py"
          rm -f .github/scripts/security-release-maintenance.py.part*
          rm -f .github/workflows/security-release-maintenance.yml
          rm -f .github/workflows/security-release-maintenance-v2.yml
          rm -f .github/workflows/fetch-maintenance-log.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify project
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm run test
          npm run build
          npm run size
          npm run package:check

      - name: Commit verified changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare @misztersoul/feathertext 0.4.0"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove non-main branches
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort -u)
          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort -u)"
          if [[ "$remaining" != "main" ]]; then
            echo "Unexpected remaining branches:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

      - name: Dispatch CI and CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main

          wait_run() {
            local workflow="$1" run_id=""
            for _ in {1..45}; do
              run_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --created ">=$before" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            if [[ -z "$run_id" ]]; then
              echo "Unable to locate dispatched workflow: $workflow" >&2
              exit 1
            fi
            gh run watch "$run_id" --exit-status
          }

          wait_run ci.yml
          wait_run codeql.yml

          high_count="1"
          for _ in {1..24}; do
            high_count="$(gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" --jq '[.[] | select((.rule.security_severity_level // .rule.severity // "") == "high" or (.rule.security_severity_level // "") == "critical")] | length')"
            [[ "$high_count" == "0" ]] && break
            sleep 10
          done
          if [[ "$high_count" != "0" ]]; then
            gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" --jq '.[] | select((.rule.security_severity_level // .rule.severity // "") == "high" or (.rule.security_severity_level // "") == "critical") | [.number, .rule.id, .most_recent_instance.location.path, .most_recent_instance.location.start_line] | @tsv' >&2
            exit 1
          fi

  report:
    name: Report failure
    needs: maintain
    if: ${{ always() && needs.maintain.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt" 2>&1 || true
          grep -v 'security-release-maintenance.py.part' "$RUNNER_TEMP/log.txt" > "$RUNNER_TEMP/filtered.txt" || true
          {
            echo "Security release maintenance v3 failed."
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/filtered.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Security release maintenance v3 failed" --body-file "$RUNNER_TEMP/body.md"
