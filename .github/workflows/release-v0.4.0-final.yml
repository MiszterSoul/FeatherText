name: Release v0.4.0 final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.4.0-final.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v0.4.0-final
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: '@misztersoul/feathertext'
  RELEASE_TAG: v0.4.0
  RELEASE_VERSION: 0.4.0
  RELEASE_SHA: 81f4ceacaf986a275e9141d51e796b27a554e205

jobs:
  release:
    name: Verify, tag, release, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
      security-events: read
    steps:
      - name: Checkout immutable release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify package and repository state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (pkg.name !== process.env.EXPECTED_PACKAGE) fail(`Unexpected package: ${pkg.name}`);
          if (pkg.version !== process.env.RELEASE_VERSION) fail(`Unexpected version: ${pkg.version}`);
          if (lock.name !== pkg.name || lock.version !== pkg.version) fail('Lockfile root metadata mismatch.');
          if (lock.packages?.['']?.name !== pkg.name || lock.packages?.['']?.version !== pkg.version) {
            fail('Lockfile package metadata mismatch.');
          }
          if (pkg.private === true || pkg.publishConfig?.access !== 'public') fail('Package is not public.');
          NODE
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 || gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists." >&2
            exit 1
          fi
          if [[ "$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" version 2>/dev/null || true)" == "$RELEASE_VERSION" ]]; then
            echo "$EXPECTED_PACKAGE@$RELEASE_VERSION already exists." >&2
            exit 1
          fi

      - name: Remove every branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort -u)
          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort -u)"
          [[ "$remaining" == "main" ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm run test
          npm run build
          npm run size
          npm run package:check

      - name: Require zero open high or critical CodeQL alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          high_count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" \
            --jq '[.[] | select((.rule.security_severity_level // .rule.severity // "") == "high" or (.rule.security_severity_level // "") == "critical")] | length')"
          [[ "$high_count" == "0" ]]

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "FeatherText $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes

      - name: Dispatch and verify npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field "tag=$RELEASE_TAG"

          run_id=""
          for _ in {1..45}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish.yml \
              --event workflow_dispatch \
              --created ">=$before" \
              --limit 10 \
              --json databaseId,headBranch \
              --jq ".[] | select(.headBranch == \"$RELEASE_TAG\") | .databaseId" \
              | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          for _ in {1..30}; do
            published="$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" version 2>/dev/null || true)"
            [[ "$published" == "$RELEASE_VERSION" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Record successful release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "FeatherText 0.4.0 release completed" \
            --body "Published public package \`@misztersoul/feathertext@0.4.0\` from tag \`v0.4.0\`. Only \`main\` remains, release verification passed, and main has zero open high/critical CodeQL alerts."

  report-failure:
    name: Report final release failure
    needs: release
    if: ${{ always() && needs.release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create diagnostic issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/log.txt" 2>&1 || true
          {
            echo "FeatherText 0.4.0 final release failed."
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            tail -n 180 "$RUNNER_TEMP/log.txt"
          } > "$RUNNER_TEMP/body.txt"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "FeatherText 0.4.0 final release failed" \
            --body-file "$RUNNER_TEMP/body.txt"
