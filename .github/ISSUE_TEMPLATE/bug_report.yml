name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve FeatherText. Please search existing issues before filing a new report.

  - type: input
    id: version
    attributes:
      label: FeatherText version
      description: Package version, release tag, or commit SHA where the problem occurs.
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a small repository, page, or exact steps that reliably reproduce the issue.
      placeholder: |
        1. Initialize FeatherText with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser and version, operating system, Node.js version, and relevant framework or bundler.
      placeholder: Chrome 140, Ubuntu 24.04, Node.js 24
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant console output or attach screenshots. Remove secrets and personal data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this with the latest release.
          required: true
