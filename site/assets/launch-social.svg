<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FeatherText social launch artwork</title>
  <desc id="desc">Landscape artwork reading FeatherText, rich text with less surface area, and the project positioning sentence.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1110" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171b22"/>
      <stop offset="0.52" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#111621"/>
    </linearGradient>
    <linearGradient id="feather" x1="805" y1="482" x2="1076" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8ff65"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(988 168) rotate(125) scale(430 490)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8ff65" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c8ff65" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#353c48" stroke-width="2"/>
  <circle cx="968" cy="162" r="390" fill="url(#glow)"/>
  <circle cx="1084" cy="-10" r="300" fill="none" stroke="#c8ff65" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1084" cy="-10" r="410" fill="none" stroke="#c8ff65" stroke-opacity="0.05" stroke-width="2"/>

  <g transform="translate(76 70)">
    <rect width="64" height="64" rx="18" fill="#11141a" stroke="#3c4451" stroke-width="2"/>
    <path d="M12 51c6-16 16-33 42-43 0 20-10 35-32 41l-10 2Z" fill="url(#feather)"/>
    <path d="M14 54c10-16 20-29 35-42M24 40l-1-13M33 32l12 1M41 23l-1-9" fill="none" stroke="#0a0b0f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="43" fill="#f5f1e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="730" letter-spacing="-1">FeatherText</text>
    <circle cx="275" cy="32" r="4" fill="#c8ff65"/>
  </g>

  <g transform="translate(76 211)">
    <text fill="#f5f1e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="760" letter-spacing="-4">
      <tspan x="0" y="0">Rich text.</tspan>
      <tspan x="0" y="82" fill="#a8adb8">Less surface area.</tspan>
    </text>
    <text x="0" y="176" fill="#c6cad2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="520">
      <tspan x="0" dy="0">A lightweight, free, framework-independent rich-text editor</tspan>
      <tspan x="0" dy="34">focused on speed, clarity, and practical customization.</tspan>
    </text>
  </g>

  <g transform="translate(72 520)">
    <rect width="164" height="42" rx="21" fill="#c8ff65"/>
    <text x="82" y="27" text-anchor="middle" fill="#172007" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">MIT · PRE-1.0</text>
    <text x="184" y="27" fill="#727986" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">github.com/MiszterSoul/FeatherText</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M739 511c51-137 137-285 358-375 0 173-88 298-278 352l-80 23Z" fill="url(#feather)"/>
    <path d="M754 538c82-137 167-248 296-357M837 416l-10-112M908 347l106 8M965 271l-7-79" fill="none" stroke="#0a0b0f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
